# expects OPENAI_API_KEY and PGVECTOR_URL/PGVECTOR_USER/PGVECTOR_PASSWORD in the environment
spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
  datasource:
    url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/capstone}
    username: ${PGVECTOR_USER:capstone}
    password: ${PGVECTOR_PASSWORD:capstone}
