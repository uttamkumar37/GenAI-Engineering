apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-api
  namespace: default
  labels:
    app: capstone-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: capstone-api
  template:
    metadata:
      labels:
        app: capstone-api
    spec:
      containers:
        - name: capstone-api
          image: capstone-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: capstone-api-config
            - secretRef:
                name: capstone-api-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
